<!DOCTYPE html>
<html>
<head>
    <title>日志 - VPS Failover Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f6f9; }
        .log-container {
            background: #1e1e2f;
            color: #f8f8f2;
            border-radius: 1rem;
            padding: 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            overflow-y: auto;
            height: 70vh;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-container pre {
            margin: 0;
            background: transparent;
            color: inherit;
        }
    </style>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="10">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-shield-shaded"></i> IP Failover Monitor</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> 仪表板</a></li>
                <li class="nav-item"><a class="nav-link" href="/settings"><i class="bi bi-gear"></i> 设置</a></li>
                <li class="nav-item"><a class="nav-link active" href="/logs"><i class="bi bi-journal-text"></i> 日志</a></li>
            </ul>
            <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> 登出</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-file-text-fill"></i> 监控日志</h2>
        <a href="/logs" class="btn btn-secondary"><i class="bi bi-arrow-repeat"></i> 刷新</a>
    </div>
    <div class="log-container" id="logContainer">
        <pre>{% for line in logs %}{{ line }}
{% endfor %}</pre>
    </div>
</div>
<script>
    function scrollToBottom() {
        const container = document.getElementById('logContainer');
        if (container) {
            container.scrollTop = container.scrollHeight;
        }
    }
    // 页面加载后滚动到底部
    window.onload = scrollToBottom;
    // 如果页面有定时刷新（meta refresh），每次刷新后也会触发 onload
    // 也可使用 MutationObserver 监控内容变化（可选）
</script>
</body>
</html>
