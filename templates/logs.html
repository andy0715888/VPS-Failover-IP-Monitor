<!DOCTYPE html>
<html>
<head>
    <title>日志 - VPS Failover Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="10">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">IP Failover Monitor</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">仪表板</a></li>
                <li class="nav-item"><a class="nav-link" href="/settings">设置</a></li>
                <li class="nav-item"><a class="nav-link active" href="/logs">日志</a></li>
            </ul>
            <a href="/logout" class="btn btn-outline-light btn-sm">登出</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h2>监控日志</h2>
    <pre class="bg-dark text-white p-3" style="overflow-x: auto; height: 70vh;">{% for line in logs %}{{ line }}
{% endfor %}</pre>
    <a href="/logs" class="btn btn-secondary">刷新</a>
</div>
</body>
</html>
